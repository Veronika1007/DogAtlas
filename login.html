<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="styles.css" />
    <title>TheDogAtlas | Login</title>
  </head>
  <body>
    <header>
      <div class="brand">
        <a href="index.html">
          <img src="Media/Logo2.jpg" alt="Logo" style="height: 55px" />
        </a>
      </div>
      <nav>
        <a href="index.html" class="nav-link">Map</a>
        <a href="planner.html" class="nav-link">Planner</a>
        <a href="trails.html" class="nav-link">Trails</a>
        <a href="events.html" class="nav-link">Events</a>
        <a href="community.html" class="nav-link">Community</a>
        <a href="login.html" class="nav-link active">Login</a>
      </nav>
    </header>
    <main>
      <div class="container" style="max-width: 400px">
        <div class="card">
          <h2 style="text-align: center">Welcome Back</h2>
          <form>
            <input
              type="email"
              placeholder="Email"
              style="
                width: 100%;
                padding: 10px;
                margin-bottom: 10px;
                border: 1px solid var(--border);
                border-radius: 8px;
              "
            />
            <input
              type="password"
              placeholder="Password"
              style="
                width: 100%;
                padding: 10px;
                margin-bottom: 10px;
                border: 1px solid var(--border);
                border-radius: 8px;
              "
            />
            <button type="submit" style="width: 100%" class="btn-main">
              Login
            </button>
          </form>
          <p style="text-align: center; font-size: 0.8rem; margin-top: 15px">
            Don't have an account?
            <a href="#" style="color: var(--primary)">Sign Up</a>
          </p>
        </div>
      </div>
    </main>
    <footer>
      <div class="footer-links">
        <a href="Footer/privacy.html">Privacy Policy</a>
        <a href="Footer/terms.html">Terms of Service</a>
        <a href="Footer/cookies.html">Cookie Policy</a>
        <a href="Footer/contact.html">Contact</a>
        <a href="Footer/about.html">About Us</a>
      </div>
      <span class="copyright"
        >&copy; 2025 TheDogAtlas. The dog-first travel platform.</span
      >
    </footer>
  </body>
</html>
