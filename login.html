<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="styles.css" />
    <title>TheDogAtlas | Login</title>
  </head>
  <body>
    <header>
      <div class="brand">
        <a href="index.html"><img src="Media/Logo2.jpg" alt="Logo" /></a>
      </div>
      <nav>
        <a href="index.html">Map</a>
        <a href="community.html">Community</a>
        <a href="login.html" class="active">Login</a>
      </nav>
    </header>
    <main class="container" style="max-width: 400px">
      <div class="card">
        <h2 style="text-align: center">Welcome Back</h2>
        <form>
          <input
            type="email"
            placeholder="Email"
            style="
              width: 100%;
              padding: 10px;
              margin-bottom: 10px;
              border: 1px solid var(--border);
              border-radius: 8px;
            "
          />
          <input
            type="password"
            placeholder="Password"
            style="
              width: 100%;
              padding: 10px;
              margin-bottom: 10px;
              border: 1px solid var(--border);
              border-radius: 8px;
            "
          />
          <button type="submit" style="width: 100%" class="btn-main">
            Login
          </button>
        </form>
        <p style="text-align: center; font-size: 0.8rem; margin-top: 15px">
          Don't have an account?
          <a href="#" style="color: var(--primary)">Sign Up</a>
        </p>
      </div>
    </main>
  </body>
</html>
